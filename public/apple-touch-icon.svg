<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350F" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.2" />
  
  <!-- Main Coin / Wallet Icon Element -->
  <g filter="url(#shadow)">
    <!-- Central Coin Plate -->
    <circle cx="256" cy="256" r="150" fill="url(#coinGrad)" stroke="#B45309" stroke-width="10" />
    <!-- Inner Dotted/Grooved Ring -->
    <circle cx="256" cy="256" r="126" fill="none" stroke="#D97706" stroke-width="4" stroke-dasharray="8 8" />
    
    <!-- Yen Symbol in Center -->
    <path d="M196 176 L236 244 L236 264 L204 264 L204 286 L236 286 L236 308 L204 308 L204 330 L236 330 L236 364 L276 364 L276 330 L308 330 L308 308 L276 308 L276 286 L308 286 L308 264 L276 264 L276 244 L316 176 L272 176 L256 208 L240 176 Z" fill="#92400E" />
  </g>

  <!-- Little Sparkle / Star on Top-Right -->
  <path d="M370 120 Q385 145 410 145 Q385 145 370 170 Q355 145 330 145 Q355 145 370 120 Z" fill="#FEF3C7" opacity="0.95" />
</svg>
